<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Precision Analog & Digital Clock</title>
  <style>
    :root {
      --bg-color: #181c24;
      --brick-base: #141820;
      --brick-mortar: rgba(8, 10, 14, 0.92);
      --spotlight: rgba(120, 160, 255, 0.12);
      --card-bg: #161b22;
      --border-color: #30363d;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --dial-bg: #090d13;
      --hour-hand: #f0f6fc;
      --min-hand: #8b949e;
      --sec-hand: #ff7b72;
      --marker: #30363d;
      --marker-major: #58a6ff;
    }

    [data-theme="light"] {
      --bg-color: #d8dee6;
      --brick-base: #c7ced8;
      --brick-mortar: rgba(160, 170, 185, 0.9);
      --spotlight: rgba(255, 255, 255, 0.35);
      --card-bg: #ffffff;
      --border-color: #d0d7de;
      --text-main: #1f2328;
      --text-muted: #656d76;
      --accent: #0969da;
      --dial-bg: #f6f8fa;
      --hour-hand: #1f2328;
      --min-hand: #57606a;
      --sec-hand: #cf222e;
      --marker: #d0d7de;
      --marker-major: #0969da;
    }

    [data-theme="emerald"] {
      --bg-color: #081a14;
      --brick-base: #061610;
      --brick-mortar: rgba(2, 8, 6, 0.94);
      --spotlight: rgba(32, 201, 151, 0.15);
      --card-bg: #0a2d21;
      --border-color: #124d38;
      --text-main: #e6fcf5;
      --text-muted: #69db7c;
      --accent: #20c997;
      --dial-bg: #04140f;
      --hour-hand: #e6fcf5;
      --min-hand: #8ce99a;
      --sec-hand: #ffd43b;
      --marker: #124d38;
      --marker-major: #20c997;
    }

    [data-theme="ruby"] {
      --bg-color: #2b1116;
      --brick-base: #220b10;
      --brick-mortar: rgba(18, 4, 7, 0.94);
      --spotlight: rgba(255, 107, 129, 0.16);
      --card-bg: #2d0d13;
      --border-color: #591622;
      --text-main: #ffe3e8;
      --text-muted: #f783ac;
      --accent: #e64980;
      --dial-bg: #140407;
      --hour-hand: #ffe3e8;
      --min-hand: #f783ac;
      --sec-hand: #ff6b6b;
      --marker: #591622;
      --marker-major: #e64980;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--brick-base);
      background-image:
        radial-gradient(circle at 50% 40%, var(--spotlight) 0%, rgba(0, 0, 0, 0.78) 75%),
        linear-gradient(335deg, rgba(0, 0, 0, 0.45) 0.25em, transparent 0.25em),
        linear-gradient(155deg, rgba(255, 255, 255, 0.08) 0.25em, transparent 0.25em),
        linear-gradient(335deg, rgba(0, 0, 0, 0.45) 0.25em, transparent 0.25em),
        linear-gradient(155deg, rgba(255, 255, 255, 0.08) 0.25em, transparent 0.25em),
        linear-gradient(to right, var(--brick-mortar) 3px, transparent 3px),
        linear-gradient(to bottom, var(--brick-mortar) 3px, transparent 3px),
        repeating-linear-gradient(45deg, rgba(0, 0, 0, 0.05) 0, rgba(0, 0, 0, 0.05) 2px, transparent 2px, transparent 4px);
      background-size:
        100% 100%,
        58px 28px,
        58px 28px,
        58px 28px,
        58px 28px,
        29px 28px,
        100% 28px,
        auto auto;
      background-position:
        0 0,
        0px 4px,
        4px 18px,
        29px 18px,
        33px 4px,
        0 0,
        0 0,
        0 0;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
      transition: background-color 0.4s ease;
    }

    .container {
      background: transparent;
      border: none;
      box-shadow: none;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      max-width: 480px;
      width: 100%;
    }

    header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .theme-select {
      background: var(--bg-color);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      outline: none;
    }

    .clock-face-container {
      position: relative;
      width: 310px;
      height: 310px;
      padding: 14px;
      border-radius: 50%;
      background: linear-gradient(135deg, #434852 0%, #1e2126 50%, #0d0f12 100%);
      box-shadow:
        0 35px 65px -10px rgba(0, 0, 0, 0.85),
        0 20px 30px -5px rgba(0, 0, 0, 0.7),
        inset 0 2px 4px rgba(255, 255, 255, 0.35),
        inset 0 -3px 8px rgba(0, 0, 0, 0.9);
    }

    .clock-face {
      position: relative;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 35%, var(--card-bg) 0%, var(--dial-bg) 75%, #020406 100%);
      border-radius: 50%;
      border: 2px solid rgba(0, 0, 0, 0.6);
      box-shadow:
        inset 0 10px 25px rgba(0, 0, 0, 0.8),
        inset 0 0 10px rgba(0, 0, 0, 0.9),
        0 1px 2px rgba(255, 255, 255, 0.15);
      overflow: hidden;
    }

    .clock-face::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(
        from 180deg at 50% 50%,
        rgba(255, 255, 255, 0.04) 0deg,
        transparent 70deg,
        rgba(255, 255, 255, 0.06) 140deg,
        transparent 210deg,
        rgba(255, 255, 255, 0.04) 360deg
      );
      pointer-events: none;
      z-index: 1;
    }

    .clock-face::after {
      content: "";
      position: absolute;
      top: 0;
      left: 10%;
      width: 80%;
      height: 48%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.14) 0%, rgba(255, 255, 255, 0) 100%);
      border-radius: 50% 50% 40% 40% / 60% 60% 20% 20%;
      pointer-events: none;
      z-index: 6;
    }

    .tick {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 2px;
      height: 8px;
      background: var(--marker);
      transform-origin: 50% 120px;
      border-radius: 1px;
      z-index: 1;
    }

    .tick.major {
      width: 4px;
      height: 14px;
      background: linear-gradient(180deg, var(--marker-major) 0%, rgba(255, 255, 255, 0.85) 50%, var(--marker-major) 100%);
      transform-origin: 50% 120px;
      box-shadow: 0 0 4px rgba(0, 0, 0, 0.7);
    }

    .hand {
      position: absolute;
      bottom: 50%;
      left: 50%;
      transform-origin: bottom center;
      border-radius: 4px;
      filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.65));
    }

    .hand.hour {
      width: 8px;
      height: 68px;
      background: linear-gradient(90deg, #d8dee9 0%, #ffffff 45%, var(--hour-hand) 55%, #8892b0 100%);
      margin-left: -4px;
      z-index: 2;
      clip-path: polygon(50% 0%, 100% 14%, 75% 100%, 25% 100%, 0% 14%);
    }

    .hand.minute {
      width: 6px;
      height: 96px;
      background: linear-gradient(90deg, #b0b8c4 0%, #ffffff 45%, var(--min-hand) 55%, #5a6275 100%);
      margin-left: -3px;
      z-index: 3;
      clip-path: polygon(50% 0%, 100% 10%, 75% 100%, 25% 100%, 0% 10%);
    }

    .hand.second {
      width: 2px;
      height: 122px;
      background: var(--sec-hand);
      margin-left: -1px;
      z-index: 4;
      transform-origin: center 104px;
      bottom: calc(50% - 18px);
      box-shadow: 0 0 3px rgba(0, 0, 0, 0.8);
    }

    .center-pin {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 14px;
      height: 14px;
      background: radial-gradient(circle at 35% 35%, #ffffff 0%, var(--sec-hand) 55%, #5c0f14 100%);
      border: 2px solid rgba(255, 255, 255, 0.5);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.8);
      z-index: 5;
    }

    
  </style>
</head>
<body>

  <div class="container">
    <header style="justify-content: flex-end;">
      <select class="theme-select" id="themePicker" aria-label="Select Theme">
        <option value="dark">Dark Theme</option>
        <option value="light">Light Theme</option>
        <option value="emerald">Emerald Theme</option>
        <option value="ruby">Ruby Theme</option>
      </select>
    </header>

    <div class="clock-face-container">
      <div class="clock-face" id="dial">
        <div class="hand hour" id="hourHand"></div>
        <div class="hand minute" id="minHand"></div>
        <div class="hand second" id="secHand"></div>
        <div class="center-pin"></div>
      </div>
    </div>

    
  </div>

  <script>
    class WorldClock {
      constructor() {
        this.hourHand = document.getElementById("hourHand");
        this.minHand = document.getElementById("minHand");
        this.secHand = document.getElementById("secHand");
        this.themePicker = document.getElementById("themePicker");
        this.dial = document.getElementById("dial");

        this.initDials();
        this.bindEvents();
        this.startEngine();
      }

      initDials() {
        for (let i = 0; i < 60; i++) {
          const tick = document.createElement("div");
          const isMajor = i % 5 === 0;
          tick.className = `tick ${isMajor ? "major" : ""}`;
          tick.style.transform = `translate(-50%, -120px) rotate(${i * 6}deg)`;
          this.dial.appendChild(tick);
        }
      }

      bindEvents() {
        this.themePicker.addEventListener("change", (e) => {
          document.documentElement.setAttribute("data-theme", e.target.value);
        });
      }

      render() {
        const now = new Date();
        const ms = now.getMilliseconds();
        const seconds = now.getSeconds() + ms / 1000;
        const minutes = now.getMinutes() + seconds / 60;
        const hours = (now.getHours() % 12) + minutes / 60;

        const secDeg = seconds * 6;
        const minDeg = minutes * 6;
        const hourDeg = hours * 30;

        this.secHand.style.transform = `rotate(${secDeg}deg)`;
        this.minHand.style.transform = `rotate(${minDeg}deg)`;
        this.hourHand.style.transform = `rotate(${hourDeg}deg)`;
      }

      startEngine() {
        const tick = () => {
          this.render();
          requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      new WorldClock();
    });
  </script>
</body>
</html>
